include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # A Token is only a Token if the value has one home. Anything the codegen writes is checked
    # against the CSS by `node scripts/gen-flutter-tokens.mjs --check`, not edited here.
    todo: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    always_declare_return_types: true
    prefer_final_locals: true
    require_trailing_commas: true
    unnecessary_const: true
